# OpenOCD 配置：NUCLEO-C542RC

> 状态：**前瞻模板，暂不可用**。截至 2026-10，OpenOCD 0.12.0（Homebrew）与上游 master 都还没有
> `tcl/target/stm32c5x.cfg`，无法调试/下载 STM32C5。官方支持合入后，本文件即可直接使用。

## 使用方法（支持后）

```bash
openocd -f templates/openocd/nucleo-c542rc.cfg \
        -c "program build/<PROJECT>.elf verify reset exit"
```

## 配置

```tcl
# ---- NUCLEO-C542RC / STM32C542RCT6 ----
# 板载 STLINK-V3EC，SWD 接口（MIPI10 CN4 可用）
adapter speed 4000

source [find interface/stlink.cfg]
transport select hla_swd

# 需要 OpenOCD 提供 target/stm32c5x.cfg；未支持前取消注释会报错
# source [find target/stm32c5x.cfg]

# 复位：只使用硬件复位，不复位 SRST 之外的域
reset_config srst_nogate
```

## 排查

```bash
# 检查当前 OpenOCD 是否认识 C5
openocd -f interface/stlink.cfg -f target/stm32c5x.cfg -c "init; shutdown"

# 列出探针
openocd -f interface/stlink.cfg -c "adapter list; shutdown"
```

若报 `couldn't open target/stm32c5x.cfg`，说明版本不支持，请改用：

- ST-LINK GDB server：`<CubeCLT>/STLink-gdb-server/bin/ST-LINK_gdbserver`
- STM32CubeProgrammer CLI：`<CubeCLT>/STM32CubeProgrammer/bin/STM32_Programmer_CLI`

## 备注

- STLINK-V3EC 也支持 `dapdirect_swd`；等 C5 支持合入后，可按 OpenOCD 文档切换传输层。
- 不要对 C5 使用 `reset_config srst_only` 之外的组合，除非确认板级复位电路行为。
